<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juan Caramba - Tarot 24/7</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Contenedor donde aparecerán las cartas dinámicas de la tirada */
        .tarot-slot {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 2;
        }
        .card {
            width: 90px;
            height: 140px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 2px solid #d4af37; /* Borde dorado místico */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #222;
            animation: fadeIn 0.8s ease-in-out;
        }
        /* Cuadro de diálogo inferior para que Juan Caramba hable */
        .speech-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 15px 20px;
            color: #f3f3f3;
            text-align: center;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }
        .speech-box h3 {
            margin: 0 0 5px 0;
            color: #d4af37;
            font-size: 18px;
        }
        .speech-box p {
            margin: 0;
            font-size: 16px;
            line-height: 1.4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen de fondo que ya subiste -->
        <img src="juan-caramba-bg.jpg" alt="Juan Caramba Tarot" class="bg-image">

        <!-- Las cartas de la tirada actual (aparecen de forma dinámica) -->
        <div class="tarot-slot" id="cardContainer">
            <!-- Las cartas se inyectarán aquí automáticamente -->
        </div>

        <!-- Cuadro de texto donde Juan Caramba habla -->
        <div class="speech-box">
            <h3>Juan Caramba</h3>
            <p id="speechText">"Saludos, alma errante... Deja que las cartas revelen lo que el destino tiene guardado para ti."</p>
        </div>
    </div>

    <script>
        // Lista de cartas de ejemplo para la tirada aleatoria
        const baraja = [
            { nombre: "El Loco", significado: "Nuevos comienzos y saltos de fe." },
            { nombre: "El Mago", significado: "Tienes todo el poder para manifestar tu realidad." },
            { nombre: "La Sacerdotisa", significado: "Secretos ocultos y sabiduría interior." },
            { nombre: "La Emperatriz", significado: "Abundancia, crecimiento y fertilidad." },
            { nombre: "La Rueda de la Fortuna", significado: "Los giros inesperados del destino." },
            { nombre: "El Ermitaño", significado: "Búsqueda interior y reflexión profunda." },
            { nombre: "La Muerte", significado: "Transformación radical y cierre de ciclos." },
            { nombre: "El Sol", significado: "Felicidad plena, éxito y claridad absoluta." }
        ];

        // Función para simular el turno de la persona y sacar cartas aleatorias
        function realizarTirada() {
            const container = document.getElementById('cardContainer');
            const speechText = document.getElementById('speechText');
            
            // Limpiamos las cartas anteriores
            container.innerHTML = '';

            // Elegimos 3 cartas al azar de la baraja
            const seleccionadas = [];
            while(seleccionadas.length < 3) {
                let cartaAleatoria = baraja[Math.floor(Math.random() * baraja.length)];
                if(!seleccionadas.includes(cartaAleatoria)) {
                    seleccionadas.push(cartaAleatoria);
                }
            }

            // Mostramos las cartas en pantalla con animación
            seleccionadas.forEach((carta, index) => {
                setTimeout(() => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    cardDiv.innerHTML = `<span>🃏</span><div style="margin-top:8px;">${carta.nombre}</div>`;
                    container.appendChild(cardDiv);
                }, index * 400); // Efecto de aparición escalonada
            });

            // Hacemos que Juan Caramba hable sobre la tirada
            speechText.innerHTML = `"${seleccionadas[0].nombre}, ${seleccionadas[1].nombre} y ${seleccionadas[2].nombre}... Veo grandes movimientos en tu camino. Escucha bien lo que las cartas dictan."`;
        }

        // Ejecutar una tirada automáticamente cada 12 segundos (simulando los turnos en vivo)
        setInterval(realizarTirada, 12000);

        // Ejecutar la primera tirada a los 3 segundos de cargar
        setTimeout(realizarTirada, 3000);
    </script>
</body>
</html>
