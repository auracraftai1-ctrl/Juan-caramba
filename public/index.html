<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juan Caramba - Tarot 24/7</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Contenedor de las cartas más grande y centrado en la mesa */
        .tarot-slot {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 2;
        }
        /* Estilo mejorado para que las cartas sean más grandes y parezcan cartas reales */
        .card {
            width: 130px;
            height: 200px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border: 3px solid #d4af37; /* Borde dorado místico */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            animation: fadeIn 0.8s ease-in-out;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #d4af37;
        }
        .card span {
            font-size: 11px;
            color: #d4af37;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Cuadro de diálogo inferior para Juan Caramba */
        .speech-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 750px;
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 15px 20px;
            color: #f3f3f3;
            text-align: center;
            z-index: 3;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
        }
        .speech-box h3 {
            margin: 0 0 5px 0;
            color: #d4af37;
            font-size: 18px;
        }
        .speech-box p {
            margin: 0;
            font-size: 16px;
            line-height: 1.4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen de fondo principal -->
        <img src="juan-caramba-bg.jpg" alt="Juan Caramba Tarot" class="bg-image">

        <!-- Espacio donde aparecerán las cartas grandes -->
        <div class="tarot-slot" id="cardContainer"></div>

        <!-- Cuadro de texto de Juan Caramba -->
        <div class="speech-box">
            <h3>Juan Caramba</h3>
            <p id="speechText">"Saludos, alma errante... Deja que las cartas revelen lo que el destino tiene guardado para ti."</p>
        </div>
    </div>

    <script>
        // Baraja con nombres y sus respectivas imágenes (puedes subir las imágenes a la carpeta public)
        const baraja = [
            { nombre: "El Loco", img: "loco.jpg", significado: "Nuevos comienzos y saltos de fe." },
            { nombre: "El Mago", img: "mago.jpg", significado: "Tienes todo el poder para manifestar tu realidad." },
            { nombre: "La Sacerdotisa", img: "sacerdotisa.jpg", significado: "Secretos ocultos y sabiduría interior." },
            { nombre: "La Emperatriz", img: "emperatriz.jpg", significado: "Abundancia, crecimiento y fertilidad." },
            { nombre: "La Rueda", img: "rueda.jpg", significado: "Los giros inesperados del destino." },
            { nombre: "El Ermitaño", img: "ermitano.jpg", significado: "Búsqueda interior y reflexión profunda." },
            { nombre: "La Muerte", img: "muerte.jpg", significado: "Transformación radical y cierre de ciclos." },
            { nombre: "El Sol", img: "sol.jpg", significado: "Felicidad plena, éxito y claridad absoluta." }
        ];

        function realizarTirada() {
            const container = document.getElementById('cardContainer');
            const speechText = document.getElementById('speechText');
            
            container.innerHTML = '';

            const seleccionadas = [];
            while(seleccionadas.length < 3) {
                let cartaAleatoria = baraja[Math.floor(Math.random() * baraja.length)];
                if(!seleccionadas.includes(cartaAleatoria)) {
                    seleccionadas.push(cartaAleatoria);
                }
            }

            seleccionadas.forEach((carta, index) => {
                setTimeout(() => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    // Renderiza la imagen de la carta y su nombre abajo
                    cardDiv.innerHTML = `
                        <img src="${carta.img}" alt="${carta.nombre}" onerror="this.src='juan-caramba-bg.jpg'">
                        <span>${carta.nombre}</span>
                    `;
                    container.appendChild(cardDiv);
                }, index * 400);
            });

            speechText.innerHTML = `"${seleccionadas[0].nombre}, ${seleccionadas[1].nombre} y ${seleccionadas[2].nombre}... Veo grandes movimientos en tu camino. Escucha bien lo que las cartas dictan."`;
        }

        // Cambia la tirada automáticamente cada 12 segundos
        setInterval(realizarTirada, 12000);
        setTimeout(realizarTirada, 3000);
    </script>
</body>
</html>
