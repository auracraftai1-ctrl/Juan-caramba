<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juan Caramba - Tarot 24/7</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Contenedor de las cartas grandes sobre la mesa */
        .tarot-slot {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 2;
        }
        .card {
            width: 130px;
            height: 200px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border: 3px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            animation: fadeIn 0.8s ease-in-out;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #d4af37;
        }
        .card span {
            font-size: 11px;
            color: #d4af37;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Cuadro de diálogo inferior para Juan Caramba */
        .speech-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px 20px;
            color: #f3f3f3;
            text-align: center;
            z-index: 3;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
        }
        .speech-box h3 {
            margin: 0 0 3px 0;
            color: #d4af37;
            font-size: 17px;
        }
        .speech-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.3;
        }
        /* Cuadro lateral de espera (10 usuarios) */
        .waiting-queue {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            z-index: 4;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
        }
        .waiting-queue h4 {
            margin: 0 0 8px 0;
            color: #d4af37;
            font-size: 14px;
            text-align: center;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .queue-item {
            font-size: 13px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        .queue-item.active {
            background: rgba(212, 175, 55, 0.35);
            border: 1px solid #d4af37;
            font-weight: bold;
            color: #ffdf73;
        }

        /* Botón estilo TikTok flotante para Seguir */
        .tiktok-follow-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        .follow-btn {
            background: linear-gradient(135deg, #fe2c55, #ff4654);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s ease, background 0.2s;
            text-decoration: none;
        }
        .follow-btn:active {
            transform: scale(0.93);
        }
        .follow-btn.followed {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
        }
        .follower-count {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        /* Animación de corazones flotantes al hacer clic */
        .floating-heart {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 24px;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Imagen de fondo principal -->
        <img src="juan-caramba-bg.jpg" alt="Juan Caramba Tarot" class="bg-image">

        <!-- Botón de Seguir estilo TikTok con contador -->
        <div class="tiktok-follow-container">
            <button class="follow-btn" id="followBtn" onclick="seguirAccion(event)">
                <span id="followIcon">➕❤️
