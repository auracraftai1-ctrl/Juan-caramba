<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juan Caramba - Tarot 24/7</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Contenedor de las cartas grandes sobre la mesa */
        .tarot-slot {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 2;
        }
        .card {
            width: 130px;
main            height: 200px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border: 3px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            animation: fadeIn 0.8s ease-in-out;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #d4af37;
        }
        .card span {
            font-size: 11px;
            color: #d4af37;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Cuadro de diálogo inferior para Juan Caramba */
        .speech-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px 20px;
            color: #f3f3f3;
            text-align: center;
            z-index: 3;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
        }
        .speech-box h3 {
            margin: 0 0 3px 0;
            color: #d4af37;
            font-size: 17px;
        }
        .speech-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.3;
        }
        /* Cuadro lateral de espera para 10 usuarios (Más grande y legible) */
        .waiting-queue {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 330px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            z-index: 4;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }
        .waiting-queue h4 {
            margin: 0 0 10px 0;
            color: #d4af37;
            font-size: 16px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 310px;
            overflow-y: hidden;
        }
        .queue-item {
            font-size: 15px;
            padding: 7px 10px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        .queue-item.active {
            background: rgba(212, 175, 55, 0.35);
            border: 1px solid #d4af37;
            font-weight: bold;
            color: #ffdf73;
            font-size: 16px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen de fondo principal -->
        <img src="juan-caramba-bg.jpg" alt="Juan Caramba Tarot" class="bg-image">

        <!-- Fila de espera de usuarios (Ampliada) -->
        <div class="waiting-queue">
            <h4>Sala de Espera (Turnos)</h4>
            <ul class="queue-list" id="queueList">
                <!-- Se llenará dinámicamente -->
            </ul>
        </div>

        <!-- Espacio de las cartas grandes -->
        <div class="tarot-slot" id="cardContainer"></div>

        <!-- Cuadro de texto de Juan Caramba -->
        <div class="speech-box">
            <h3>Juan Caramba</h3>
            <p id="speechText">"Saludos, alma errante... Deja que las cartas revelen lo que el destino tiene guardado para ti."</p>
        </div>
    </div>
